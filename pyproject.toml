[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "position-risk-mcp"
version = "0.1.0"
description = "Deterministic position sizing and pre-trade risk gate for trading agents, served over MCP"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mcp>=1.2,<2",        # FastMCP API; mcp 2.x renamed it (MCPServer)
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
position-risk-mcp = "position_risk_mcp.server:main"
position-risk-admin = "position_risk_mcp.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/position_risk_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
